[project]
name = "thekitchen"
version = "0.1.0"
description = "Brewing records where every number carries its provenance"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "httpx>=0.27"]

[project.scripts]
kitchen = "kitchen.__main__:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
kitchen = ["schema.sql", "static/*.html"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
